name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install checks
        # Keep lint results reproducible instead of inheriting new rules from
        # whichever Ruff release happens to be latest when the workflow runs.
        run: python -m pip install ruff==0.14.11
      - name: Lint and format check
        run: |
          ruff check main.py tests
          ruff format --check main.py tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
